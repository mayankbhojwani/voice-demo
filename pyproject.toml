[project]
name = "voice-demo"
version = "0.1.0"
description = "Local voice agent demo (Pipecat + Ollama) for learning voice-AI latency, interruptions and noise"
requires-python = ">=3.11,<3.14"
dependencies = [
    # M1 only: mic transport, MLX Whisper STT, Silero VAD.
    # LLM / TTS extras are added in the milestone that needs them.
    # `whisper` is needed too: pipecat's whisper module imports faster_whisper at top level.
    "pipecat-ai[kokoro,local,mlx-whisper,silero,whisper]",
    "pipecat-gnani>=0.6.0",
    "python-dotenv",
]

[dependency-groups]
dev = ["pytest"]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_demo"]
